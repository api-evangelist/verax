aid: verax
name: Verax
description: >-
  Verax AI is an enterprise AI security platform that gives organizations
  real-time visibility and control over how employees and agents use generative
  AI. Its flagship product, Verax Protect, discovers shadow AI usage across every
  LLM tool, enforces identity- and role-aware access policies, and applies
  content-aware data-loss prevention to stop sensitive data from leaking into
  ChatGPT, Claude, Gemini, Copilot and other AI services. Verax Control Center
  adds monitoring and governance for LLM-based products running in production.
  Verax deploys via an endpoint agent and integrates with Okta, Microsoft Entra
  ID and Google Workspace for identity. Founded in 2023 (Dallas, Tel Aviv,
  London) and backed by TQ Ventures, Seedcamp and others.
